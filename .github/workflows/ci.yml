name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --no-banner --redact -v

  branch-name:
    name: branch starts with a ticket key
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check
        env:
          BRANCH: ${{ github.head_ref }}
          TICKET_PATTERN: ${{ vars.TICKET_PATTERN }}
        run: |
          if [ -z "$TICKET_PATTERN" ]; then unset TICKET_PATTERN; fi
          scripts/check_branch.sh "$BRANCH"

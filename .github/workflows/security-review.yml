# Automated security review on PRs (anthropics/claude-code-security-review).
# Needs the ANTHROPIC_API_KEY secret; skipped without it.
# The action is not hardened against prompt injection: in the repository's
# Actions settings, require approval before running workflows from outside
# contributors.
name: security-review

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  security:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Skip when no API key is configured
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main
        if: steps.key.outputs.present == 'true'
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

# Install once per clone:  pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type pre-push
# Works for every tool (Claude Code, Codex, humans): it runs on git, not in the agent.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: adr-lint
        name: ADR statuses and links
        entry: python3 scripts/adr_lint.py docs/adr
        language: system
        files: ^docs/adr/
        pass_filenames: false
      - id: branch-name
        name: Branch starts with a ticket key
        entry: scripts/check_branch.sh
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
